name: Provider regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check index.mjs
      - run: node --test review.test.mjs
      - run: node --test tools.test.mjs
      - run: node --test prompt.test.mjs
      - run: node --test native.test.mjs
      - run: node --test native-mode.test.mjs

